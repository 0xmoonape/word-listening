            ["next","/nekst/","adj./adv.","下一个的；接下来的；其次；然后；隔壁的"],
            ["nice","/naɪs/","adj.","好的；美好的；令人愉快的；友好的；精细的"],
            ["niece","/niːs/","n.","侄女；外甥女"],
            ["night","/naɪt/","n.","夜晚；晚上；黑夜；夜间；晚安"],
            ["no","/nəʊ/","adv./adj.","不；不是；没有；无；不许；禁止"],
            ["noble","/ˈnəʊbl/","adj./n.","高尚的；崇高的；贵族的；宏伟的；贵族"],
            ["nobody","/ˈnəʊbədi/","pron./n.","没有人；无人；谁也不；小人物；无足轻重的人"],
            ["nod","/nɒd/","v./n.","点头；点头表示；打盹；打瞌睡；点头同意"],
            ["noise","/nɔɪz/","n.","噪音；喧闹声；杂音；响声；议论"],
            ["noisy","/ˈnɔɪzi/","adj.","嘈杂的；喧闹的；吵闹的；充满噪音的"],
            ["none","/nʌn/","pron./adv.","没有一个；毫无；决不；一点也不；毫无"],
            ["noodle","/ˈnuːdl/","n.","面条；鸡蛋面；笨蛋；傻瓜"],
            ["noon","/nuːn/","n.","中午；正午；全盛期；最高点"],
            ["nor","/nɔː(r)/","conj.","也不；也没有；而不；又不"],
            ["normal","/ˈnɔːml/","adj./n.","正常的；标准的；正规的；常态；正常"],
            ["north","/nɔːθ/","n./adj./adv.","北方；北部；北方的；在北方；向北"],
            ["northern","/ˈnɔːðən/","adj.","北方的；北部的；来自北方的；向北的"],
            ["nose","/nəʊz/","n.","鼻子；嗅觉；气味；船头；前端；探听"],
            ["not","/nɒt/","adv.","不；没有；不会；并非；并不是说"],
            ["note","/nəʊt/","n./v.","笔记；记录；便条；注释；音符；注意；记下"],
            ["notebook","/ˈnəʊtbʊk/","n.","笔记本；笔记本电脑；簿子；手册"],
            ["nothing","/ˈnʌθɪŋ/","pron./n.","没有什么；没有东西；无关紧要的事；零"],
            ["notice","/ˈnəʊtɪs/","v./n.","注意到；察觉到；通知；通告；布告；短评"],
            ["novel","/ˈnɒvl/","n./adj.","小说；长篇小说；新奇的；新颖的；奇异的"],
            ["now","/naʊ/","adv./n.","现在；如今；目前；立刻；马上；这时"],
            ["nowadays","/ˈnaʊədeɪz/","adv.","现今；现在；如今；当今"],
            ["number","/ˈnʌmbə(r)/","n./v.","数；数字；号码；数量；编号；总计；计入"],
            ["nurse","/nɜːs/","n./v.","护士；保姆；保育员；护理；照料；喂奶"],
            ["nut","/nʌt/","n.","坚果；干果；螺母；螺帽；疯子"],
            ["obey","/əˈbeɪ/","v.","服从；遵守；顺从；听从；执行"],
            ["object","/ˈɒbdʒɪkt/ /əbˈdʒekt/","n./v.","物体；对象；目标；宾语；反对；抗议"],
            ["observe","/əbˈzɜːv/","v.","观察；观测；注意到；遵守；评述；庆祝"],
            ["obtain","/əbˈteɪn/","v.","获得；得到；买到；存在；流行"],
            ["obvious","/ˈɒbviəs/","adj.","明显的；显然的；显而易见的；无疑的"],
            ["occasion","/əˈkeɪʒn/","n.","场合；时机；机会；理由；原因；盛会"],
            ["occupy","/ˈɒkjupaɪ/","v.","占据；占用；占领；使忙碌；担任；使从事"],
            ["occur","/əˈkɜː(r)/","v.","发生；出现；存在；被发现；想到；想起"],
            ["ocean","/ˈəʊʃn/","n.","海洋；大海；大洋；浩瀚；无限"],
            ["o'clock","/əˈklɒk/","adv.","...点钟；...时；整点"]
        ];

        // ===== 状态管理 =====
        let currentIndex = 0;
        let isPlaying = false;
        let playMode = 'full'; // full / english / spelling
        let isLooping = true;
        let intervalMs = 2000;
        let speechRate = 0.8;
        let timerMinutes = 30;
        let timerInterval = null;
        let secondsLeft = 0;

        // DOM 元素
        const wordSpelling = document.getElementById('wordSpelling');
        const wordPhonetic = document.getElementById('wordPhonetic');
        const wordPos = document.getElementById('wordPos');
        const wordMeaning = document.getElementById('wordMeaning');
        const wordIndex = document.getElementById('wordIndex');
        const currentNum = document.getElementById('currentNum');
        const totalNum = document.getElementById('totalNum');
        const progressFill = document.getElementById('progressFill');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const timerCount = document.getElementById('timerCount');

        // 初始化
        totalNum.textContent = vocab.length;
        updateWordDisplay();

        // ===== 语音合成 =====
        function speak(text, rate = speechRate) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = rate;
                
                // 尝试选择英语语音
                const voices = window.speechSynthesis.getVoices();
                const englishVoice = voices.find(v => v.lang.startsWith('en') && v.localService);
                if (englishVoice) {
                    utterance.voice = englishVoice;
                }
                
                window.speechSynthesis.speak(utterance);
                return utterance;
            }
        }

        function speakChinese(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = speechRate;
                
                const voices = window.speechSynthesis.getVoices();
                const chineseVoice = voices.find(v => v.lang.startsWith('zh'));
                if (chineseVoice) {
                    utterance.voice = chineseVoice;
                }
                
                window.speechSynthesis.speak(utterance);
                return utterance;
            }
        }

        // ===== 播放当前单词 =====
        function playCurrentWord() {
            const word = vocab[currentIndex];
            
            if (playMode === 'english') {
                // 仅英文：读单词
                speak(word[0]);
            } else if (playMode === 'spelling') {
                // 拼写模式：逐个字母拼读
                const letters = word[0].split('');
                letters.forEach((letter, i) => {
                    setTimeout(() => {
                        speak(letter, 0.9);
                    }, i * 500);
                });
                // 最后读完整单词
                setTimeout(() => {
                    speak(word[0]);
                }, letters.length * 500 + 300);
            } else {
                // 完整模式：单词 + 中文释义
                const utterance = speak(word[0]);
                if (utterance) {
                    utterance.onend = () => {
                        setTimeout(() => {
                            speakChinese(word[3]);
                        }, 300);
                    };
                }
            }
        }

        // ===== 更新显示 =====
        function updateWordDisplay() {
            const word = vocab[currentIndex];
            wordSpelling.textContent = word[0];
            wordPhonetic.textContent = word[1];
            wordPos.textContent = word[2];
            wordMeaning.textContent = word[3];
            wordIndex.textContent = String(currentIndex + 1).padStart(3, '0');
            currentNum.textContent = currentIndex + 1;
            progressFill.style.width = ((currentIndex + 1) / vocab.length * 100) + '%';
        }

        // ===== 播放控制 =====
        function togglePlay() {
            if (isPlaying) {
                pausePlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            isPlaying = true;
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
            playCurrentWord();
            scheduleNext();
        }

        function pausePlayback() {
            isPlaying = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            if (nextTimer) {
                clearTimeout(nextTimer);
                nextTimer = null;
            }
        }

        let nextTimer = null;
        function scheduleNext() {
            if (nextTimer) clearTimeout(nextTimer);
            
            // 根据播放模式调整间隔
            let waitTime = intervalMs;
            if (playMode === 'full') waitTime += 1500; // 中文释义需要额外时间
            if (playMode === 'spelling') waitTime += 2000; // 拼读需要更长时间
            
            nextTimer = setTimeout(() => {
                nextWord();
            }, waitTime);
        }

        function nextWord() {
            if (currentIndex < vocab.length - 1) {
                currentIndex++;
                updateWordDisplay();
                if (isPlaying) {
                    playCurrentWord();
                    scheduleNext();
                }
            } else if (isLooping) {
                currentIndex = 0;
                updateWordDisplay();
                if (isPlaying) {
                    playCurrentWord();
                    scheduleNext();
                }
            } else {
                pausePlayback();
            }
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                updateWordDisplay();
                if (isPlaying) {
                    playCurrentWord();
                    scheduleNext();
                }
            }
        }

        // ===== 定时器 =====
        function startTimer(minutes) {
            stopTimer();
            if (minutes > 0) {
                secondsLeft = minutes * 60;
                timerDisplay.classList.add('visible');
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    secondsLeft--;
                    updateTimerDisplay();
                    if (secondsLeft <= 0) {
                        stopPlayback();
                        stopTimer();
                    }
                }, 1000);
            } else {
                timerDisplay.classList.remove('visible');
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsLeft / 60);
            const secs = secondsLeft % 60;
            timerCount.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function stopPlayback() {
            pausePlayback();
        }

        // ===== 事件绑定 =====
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevWord);
        nextBtn.addEventListener('click', nextWord);

        // 模式选择
        document.querySelectorAll('[data-mode]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                playMode = btn.dataset.mode;
                if (isPlaying) {
                    playCurrentWord();
                }
            });
        });

        // 间隔选择
        document.querySelectorAll('[data-interval]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-interval]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                intervalMs = parseInt(btn.dataset.interval);
            });
        });

        // 语速选择
        document.querySelectorAll('[data-rate]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-rate]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                speechRate = parseFloat(btn.dataset.rate);
            });
        });

        // 定时器选择
        document.querySelectorAll('[data-timer]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-timer]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                timerMinutes = parseInt(btn.dataset.timer);
                startTimer(timerMinutes);
            });
        });

        // 循环开关
        document.getElementById('loopBtn').addEventListener('click', function() {
            isLooping = !isLooping;
            this.textContent = isLooping ? '开启' : '关闭';
            this.classList.toggle('active', isLooping);
        });

        // 预加载语音
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // 启动默认定时器
        startTimer(30);
    </script>
</body>
